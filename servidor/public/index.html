<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoramento de Enchentes</title>
  <meta name="description" content="Painel do protótipo IoT de monitoramento de enchentes">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/painel.css">
  <script>
    (function applySavedTheme() {
      var theme = null;
      try { theme = localStorage.getItem('painel-tema'); } catch (error) { theme = null; }
      if (theme === 'claro' || theme === 'escuro') document.documentElement.dataset.theme = theme === 'escuro' ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Início do painel">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M16 3c4.8 6.2 9 11.2 9 16a9 9 0 0 1-18 0c0-4.8 4.2-9.8 9-16z"/><path class="wave" d="M9.5 20.5c2 1.6 4.2 1.6 6.5 0s4.5-1.6 6.5 0"/></svg>
      </span>
      <span class="brand-text">
        <strong>Monitoramento de Enchentes</strong>
        <small>Protótipo IoT · maquete do rio</small>
      </span>
    </a>

    <nav class="topnav" aria-label="Seções do painel">
      <a href="#/" data-nav="overview">Visão geral</a>
      <a href="#/decisao" data-nav="decision">Como decide</a>
      <a href="#/sensores" data-nav="sensors">Sensores</a>
    </nav>

    <div class="topbar-status" id="system-pill" role="status" aria-live="polite">
      <span class="dot"></span><span class="label">Conectando…</span>
    </div>

    <div class="topbar-actions">
      <span class="clock" id="clock" aria-label="Hora atual"></span>
      <button class="icon-button" id="sound-toggle" type="button" aria-pressed="false" title="Alertas sonoros e notificações">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="bell" d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path class="slash" d="M3 3l18 18"/></svg>
        <span class="sr-only">Alertas sonoros</span>
      </button>
      <button class="icon-button" id="theme-toggle" type="button" title="Alternar tema claro/escuro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/><g class="sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
        <span class="sr-only">Alternar tema</span>
      </button>
      <button class="icon-button" id="fullscreen-toggle" type="button" title="Tela cheia">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span class="sr-only">Tela cheia</span>
      </button>
    </div>
  </header>

  <main id="conteudo" class="page" tabindex="-1"></main>

  <footer class="footer" id="footer"></footer>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <dialog class="dialog" id="dialog"></dialog>

  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
